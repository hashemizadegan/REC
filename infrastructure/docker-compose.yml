version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rec_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rec_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rec_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-rec_trade}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rec_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: rec_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - rec_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rec_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rec_user}:${POSTGRES_PASSWORD:-rec_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-rec_trade}
      NODE_ENV: production
    depends_on:
      - postgres
    networks:
      - rec_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rec_frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - rec_network

volumes:
  postgres_data:
  n8n_data:

networks:
  rec_network:
    driver: bridge
